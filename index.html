<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forex Signal Bot</title>
<style>
body{background:#101827;color:white;font-family:Arial;text-align:center;padding:15px}
.box{background:#1e293b;padding:18px;border-radius:14px;margin:15px 0}
input,select,button{width:95%;padding:13px;margin:8px 0;border-radius:8px;font-size:16px;box-sizing:border-box}
button{background:#16a34a;color:white;border:0;font-weight:bold}
h1{color:#38bdf8}
#signal{font-size:32px;font-weight:bold}
.small{color:#cbd5e1;font-size:13px}
</style>
</head>
<body>

<h1>FOREX SIGNAL BOT</h1>
<p>LIVE FOREX | 1 MINUTE</p>

<div class="box">
<h3>Twelve Data API Key</h3>
<input id="api" type="password" placeholder="Apni API key yahan enter karein">

<h3>Select Pair</h3>
<select id="pair">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>AUD/USD</option>
<option>USD/CAD</option>
</select>

<button onclick="checkSignal()">CHECK LIVE SIGNAL</button>
<h2 id="signal">WAIT</h2>
<p id="info">API key enter karke signal check karein</p>
<p class="small">Strategy: EMA 9 / EMA 21 + RSI 14</p>
</div>

<div class="box">
<h3>Accuracy Record</h3>
<h2 id="accuracy">--%</h2>
<p id="stats">Wins: 0 | Losses: 0</p>
<p class="small">Accuracy sirf completed signals par count hogi.</p>
</div>

<script>
const KEY = "forexBotResults";
const PENDING = "forexBotPending";
const LAST = "forexBotLast";

function getData(key){
 try{return JSON.parse(localStorage.getItem(key)) || []}
 catch(e){return []}
}

function showStats(){
 let records=getData(KEY);
 let wins=records.filter(x=>x==="WIN").length;
 let losses=records.filter(x=>x==="LOSS").length;
 let total=wins+losses;
 document.getElementById("accuracy").innerText=
 total ? (wins/total*100).toFixed(1)+"%" : "--%";
 document.getElementById("stats").innerText=
 "Wins: "+wins+" | Losses: "+losses+" | Total: "+total;
}

function ema(values,period){
 let k=2/(period+1);
 let result=values.slice(0,period).reduce((a,b)=>a+b,0)/period;
 for(let i=period;i<values.length;i++){
  result=values[i]*k+result*(1-k);
 }
 return result;
}

function rsi(values,period=14){
 let gain=0,loss=0;
 for(let i=1;i<=period;i++){
  let d=values[i]-values[i-1];
  if(d>0) gain+=d;
  else loss-=d;
 }
 let avgGain=gain/period;
 let avgLoss=loss/period;
 for(let i=period+1;i<values.length;i++){
  let d=values[i]-values[i-1];
  avgGain=(avgGain*(period-1)+Math.max(d,0))/period;
  avgLoss=(avgLoss*(period-1)+Math.max(-d,0))/period;
 }
 if(avgLoss===0) return 100;
 return 100-(100/(1+avgGain/avgLoss));
}

async function checkSignal(){
 const api=document.getElementById("api").value.trim();
 const pair=document.getElementById("pair").value;
 const signal=document.getElementById("signal");
 const info=document.getElementById("info");

 if(!api){
  info.innerText="Pehle API key enter karein.";
  return;
 }

 signal.innerText="CHECKING...";
 info.innerText="Live Forex data check ho raha hai...";

 try{
  const url="https://api.twelvedata.com/time_series?symbol="+
  encodeURIComponent(pair)+
  "&interval=1min&outputsize=100&timezone=UTC&order=ASC&apikey="+
  encodeURIComponent(api);

  const response=await fetch(url);
  const data=await response.json();

  if(!data.values){
   throw new Error(data.message || "Live data nahi mila.");
  }

  const now=Date.now();
  const candles=data.values.filter(c=>{
   return new Date(c.datetime.replace(" ","T")+"Z").getTime()
   <= now-60000;
  });

  if(candles.length<30){
   throw new Error("Kafi candles nahi milay. Baad mein try karein.");
  }

  const closes=candles.map(c=>Number(c.close));
  const latest=candles[candles.length-1];
  const latestTime=latest.datetime;
  const pending=localStorage.getItem(PENDING);

  // Pichlay signal ka result check karo
  if(pending){
   const p=JSON.parse(pending);
   const next=candles.find(c=>
    new Date(c.datetime.replace(" ","T")+"Z") >
    new Date(p.time.replace(" ","T")+"Z")
   );

   if(next){
    const close=Number(next.close);
    const win=p.signal==="BUY" ?
     close>p.price : close<p.price;

    let records=getData(KEY);
    records.push(win?"WIN":"LOSS");
    localStorage.setItem(KEY,JSON.stringify(records.slice(-500)));
    localStorage.removeItem(PENDING);
    showStats();
   }else{
    signal.innerText="WAIT";
    info.innerText="Pichlay signal ka result abhi pending hai.";
    return;
   }
  }

  const last=localStorage.getItem(LAST);
  const candleKey=pair+"|"+latestTime;

  if(last===candleKey){
   signal.innerText="WAIT";
   info.innerText="Is candle ka signal pehle check ho chuka hai.";
   return;
  }

  const e9=ema(closes,9);
  const e21=ema(closes,21);
  const r=rsi(closes,14);

  let result="WAIT";

  if(e9>e21 && r>=55) result="BUY";
  if(e9<e21 && r<=45) result="SELL";

  localStorage.setItem(LAST,candleKey);

  signal.innerText=result;
  signal.style.color=
   result==="BUY"?"#22c55e":
   result==="SELL"?"#ef4444":"#facc15";

  info.innerText="EMA9: "+e9.toFixed(5)+
   " | EMA21: "+e21.toFixed(5)+
   " | RSI: "+r.toFixed(1);

  if(result!=="WAIT"){
   localStorage.setItem(PENDING,JSON.stringify({
    signal:result,
    price:Number(latest.close),
    time:latestTime,
    pair:pair
   }));
   info.innerText+=" | Result aglay candle par check hoga.";
  }

 }catch(error){
  signal.innerText="WAIT";
  info.innerText="Masla: "+error.message;
 }
}

showStats();
</script>
</body>
</html>
